name: CloudMotors
description: A vehicle service booking application.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: any
  google_fonts: any
  cupertino_icons: ^0.1.3
  flutter_phone_direct_caller: ^2.1.0
  firebase_core: ^1.12.0
  get: ^4.6.1
  flutter_swiper_null_safety: ^1.0.2
  flutter_native_splash: ^2.0.4
  firebase_auth: ^3.3.7
  firebase_auth_web: ^3.3.7
  cloud_firestore: ^3.1.9
  url_launcher: ^6.0.20
  url_launcher_web: ^2.0.9
  flutter_share: ^2.0.0
  syncfusion_flutter_calendar: ^19.4.54

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^0.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/
    - assets/illustrations/

  fonts:
    - family: myRiadh
      fonts:
        - asset: assets/fonts/myRiadh.otf