name: CloudMotors
description: A vehicle service booking application. Developed by Tarun (insta @blessedtarun)

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: any
  google_fonts: any
  cupertino_icons: ^0.1.3
  flutter_phone_direct_caller: ^2.1.0
  firebase_core: ^1.12.0
  get: ^4.6.1
  flutter_swiper_null_safety: ^1.0.2
  flutter_native_splash: ^2.0.4

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^0.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/

  fonts:
    - family: myRiadh
      fonts:
        - asset: assets/fonts/myRiadh.otf